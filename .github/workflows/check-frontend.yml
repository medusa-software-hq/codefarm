name: Check frontend

on:
  workflow_call:

permissions:
  contents: read

env:
  NO_COLOR: 1

jobs:
  check-edge:
    name: Check frontend Workers
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: frontend/.nvmrc

      - name: Install dependencies
        run: corepack yarn install --immutable

      - name: Check formatting
        run: corepack yarn oxfmt --check "**/*.{ts,tsx}"

      - name: Lint
        run: corepack yarn oxlint --type-aware

      - name: Type check
        run: corepack yarn tsc --noEmit

      - name: Build
        run: corepack yarn vite build
