name: Check edge

on:
  workflow_call:

permissions:
  contents: read

env:
  NO_COLOR: 1

jobs:
  check-edge:
    name: Check edge Workers
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend/edge

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: backend/edge/.nvmrc

      - name: Install dependencies
        run: corepack yarn install --immutable

      - name: Check formatting
        run: corepack yarn oxfmt --check "**/*.ts"

      - name: Lint
        run: corepack yarn oxlint --type-aware

      - name: Type check
        run: corepack yarn tsc --noEmit

      - name: Test
        run: node --test "*/src/**/*.test.ts"

      - name: Bundle the app Worker
        run: >-
          corepack yarn workspace app esbuild src/index.ts
          --bundle --format=esm --platform=neutral --target=es2022 --outfile=dist/worker.js
