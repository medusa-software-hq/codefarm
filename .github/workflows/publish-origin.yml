name: Publish origin

on:
  push:
    branches: [main]
    paths:
      - backend/origin/**
      - gradle/**
      - '*.gradle.kts'
      - gradle.properties
      - .github/workflows/publish-origin.yml
      - .github/actions/write-back/**
  workflow_dispatch:

concurrency:
  group: publish-origin

permissions:
  contents: read
  id-token: write

env:
  NO_COLOR: 1
  # Codefarm's pool, which trusts the artifact builder on main
  CODEFARM_POOL_PROVIDER: projects/76431914348/locations/global/workloadIdentityPools/github/providers/github-actions
  BASE_PROJECT: codefarm-x-07da3c
  IMAGES: europe-central2-docker.pkg.dev/codefarm-x-07da3c/images

jobs:
  publish-service:
    name: Publish the service
    runs-on: ubuntu-latest

    outputs:
      digest: ${{ steps.push.outputs.digest }}
      version: ${{ steps.push.outputs.version }}

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6.4.0

      - name: Log in to GCP
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.CODEFARM_POOL_PROVIDER }}
          service_account: artifact-builder@${{ env.BASE_PROJECT }}.iam.gserviceaccount.com

      # Unchanged sources give the same image, whose layers are already there; the tag names the
      # commit, and tags are immutable
      - name: Build and push the image
        id: push
        run: |
          ./gradlew :backend:origin:service:jib \
            -Djib.to.image="$IMAGES/service:$GITHUB_SHA" -Djib.to.credHelper=gcloud
          digest=$(cat backend/origin/service/build/jib-image.digest)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "version=${digest#sha256:}" >> "$GITHUB_OUTPUT"
          echo "Pushed service@$digest" >> "$GITHUB_STEP_SUMMARY"

  write-back:
    name: Write back to codefarm-infra
    needs: publish-service
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: ./.github/actions/write-back
        with:
          artifact: service
          pin: '{"image": "${{ env.IMAGES }}/service@${{ needs.publish-service.outputs.digest }}"}'
          version: ${{ needs.publish-service.outputs.version }}
          built: Image `${{ needs.publish-service.outputs.digest }}`
          identity-provider: ${{ env.CODEFARM_POOL_PROVIDER }}
          base-project: ${{ env.BASE_PROJECT }}
