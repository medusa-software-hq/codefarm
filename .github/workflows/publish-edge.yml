name: Publish edge

on:
  push:
    branches: [main]
    paths:
      - backend/edge/**
      - .github/workflows/publish-edge.yml
  workflow_dispatch:

concurrency:
  group: publish-edge

permissions:
  contents: read
  id-token: write

env:
  NO_COLOR: 1
  # Codefarm's pool, which trusts the artifact builder on main
  CODEFARM_POOL_PROVIDER: projects/76431914348/locations/global/workloadIdentityPools/github/providers/github-actions
  BASE_PROJECT: codefarm-x-07da3c

jobs:
  publish-app:
    name: Publish the app Worker
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.upload.outputs.version }}

    defaults:
      run:
        working-directory: backend/edge

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: backend/edge/.nvmrc

      - name: Install dependencies
        run: corepack yarn install --immutable

      - name: Bundle the app Worker
        run: >-
          corepack yarn workspace app esbuild src/index.ts
          --bundle --format=esm --platform=neutral --target=es2022 --outfile=dist/worker.js

      - name: Log in to GCP
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.CODEFARM_POOL_PROVIDER }}
          service_account: artifact-builder@${{ env.BASE_PROJECT }}.iam.gserviceaccount.com

      # Versioned by its SHA-256, so an unchanged bundle is already there
      - name: Upload the bundle
        id: upload
        run: |
          version=$(sha256sum app/dist/worker.js | cut --delimiter=' ' --fields=1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          bundles=(--repository=bundles --location=europe-central2 --project="$BASE_PROJECT")

          if gcloud artifacts versions describe "$version" --package=edge-app "${bundles[@]}" \
            > /dev/null 2>&1; then
            echo "edge-app $version is already uploaded" >> "$GITHUB_STEP_SUMMARY"
          else
            gcloud artifacts generic upload --package=edge-app --version="$version" \
              --source=app/dist/worker.js "${bundles[@]}"
            echo "Uploaded edge-app $version" >> "$GITHUB_STEP_SUMMARY"
          fi

  # Pins the bundle in codefarm-infra, whose preview of the pull request shows what deploying it
  # changes, and whose merge deploys it
  write-back:
    name: Write back to codefarm-infra
    needs: publish-app
    runs-on: ubuntu-latest

    steps:
      - name: Log in to GCP
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.CODEFARM_POOL_PROVIDER }}
          service_account: artifact-builder@${{ env.BASE_PROJECT }}.iam.gserviceaccount.com

      - name: Read the write-back GitHub App's key
        id: secrets
        uses: google-github-actions/get-secretmanager-secrets@v3
        with:
          secrets: key:${{ env.BASE_PROJECT }}/github-write-back-key

      - name: Get a token for codefarm-infra
        id: token
        uses: actions/create-github-app-token@v3.2.0
        with:
          client-id: Iv23li4vccWccrn8EZ2t
          private-key: ${{ steps.secrets.outputs.key }}
          repositories: codefarm-infra
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@v7.0.1
        with:
          repository: medusa-software-hq/codefarm-infra
          token: ${{ steps.token.outputs.token }}

      - name: Open or update the pull request
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          APP_SLUG: ${{ steps.token.outputs.app-slug }}
          VERSION: ${{ needs.publish-app.outputs.version }}
          SOURCE: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
        run: |
          pin=infra/app/artifacts/edge-app.json
          jq --arg version "$VERSION" '.sha256 = $version' "$pin" > pin.json && mv pin.json "$pin"
          if git diff --quiet; then
            echo "codefarm-infra already pins edge-app $VERSION" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # As the App's bot account, so the commits are attributed to it
          user_id=$(gh api "/users/$APP_SLUG%5Bbot%5D" --jq .id)
          git config user.name "$APP_SLUG[bot]"
          git config user.email "$user_id+$APP_SLUG[bot]@users.noreply.github.com"

          # A branch per artifact, rebuilt from main each time: one pull request per artifact, which
          # leaves the others' alone
          branch=write-back/edge-app
          git switch --create "$branch"
          git commit --all --message "Deploy edge-app ${VERSION:0:12}" --message "Built from $SOURCE"
          git push --force origin "$branch"

          if [[ -z $(gh pr list --head "$branch" --json number --jq '.[].number') ]]; then
            gh pr create --head "$branch" --title "Deploy edge-app" \
              --body "Pins the app Worker's bundle that \`codefarm\` built and uploaded. Merging deploys it."
          fi
          echo "Wrote back edge-app $VERSION" >> "$GITHUB_STEP_SUMMARY"
