version: '3'

# noinspection YAMLSchemaValidation
.kotlinSources: &kotlinSources
  - '**/*.kt'
  - '**/*.kts'

tasks:
  build:
    desc: Build and check every JVM module
    sources: *kotlinSources
    cmds:
      - ./gradlew build

  checkFormatting:
    desc: Check Kotlin formatting across every module
    sources: *kotlinSources
    cmds:
      - ./gradlew ktfmtCheck

  fixFormatting:
    desc: Fix Kotlin formatting across every module
    sources: *kotlinSources
    cmds:
      - ./gradlew ktfmtFormat

  serviceImage:
    desc: Build the service's image into backend/origin/service/build/jib-image.tar
    cmds:
      - ./gradlew :backend:origin:service:jibBuildTar

  runService:
    desc: Run the service locally, on port 8080
    interactive: true
    cmds:
      - ./gradlew :backend:origin:service:run --console=plain
